<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2137">
<meta name="description" content="طقس الشرقاط: الحالة الجوية والتوقعات والتنبيهات خلال الساعات والأيام القادمة">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="طقس الشرقاط">
<title>طقس الشرقاط المباشر</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f3f4f8;--ink:#1b1f27;--mut:#5d6575;--line:#dde1ea;--sel:#1b2433;--gold:#b8964f;--info:#e3f0fb;--dust:#fdf0dc}
@media(prefers-color-scheme:dark){:root{--bg:#121824;--card:#1b2433;--ink:#fff;--mut:#b0c4de;--line:#2c384c;--sel:#ffd166;--info:#12486d;--dust:#4a3514}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:8px 10px 12px;background:var(--bg);color:var(--ink);font:15px/1.5 Tahoma,Arial,"Noto Sans Arabic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:auto;display:grid;gap:9px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hd h1{margin:0;font-size:1.15rem;font-weight:900}
.sub{font-size:.78rem;color:var(--mut)}
.hr{display:flex;align-items:center;gap:8px}
#clk{font-weight:900;font-variant-numeric:tabular-nums;padding:3px 10px;border:1.5px solid var(--gold);border-radius:10px;font-size:.9rem}
#ref{width:34px;height:34px;border:0;border-radius:50%;background:var(--card);font-size:1.25rem;transition:transform .6s}
#ref.spin{transform:rotate(360deg)}
.now{background:var(--card);border-radius:28px;overflow:hidden}
.nt{padding:14px 18px 6px}
.lbl{font-weight:800;font-size:1rem;display:flex;gap:8px;align-items:center}
.live{font-size:.72rem;font-weight:400;color:var(--mut)}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-inline-end:5px}
.live.off::before{background:#f59e0b}
.nm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.tmp{display:flex;align-items:center;gap:8px}
.tmp b{font-size:clamp(3.4rem,15vw,4.6rem);line-height:1;font-weight:700;direction:ltr}
.cd{font-size:1.05rem;font-weight:800;text-align:start}
.cd small{display:block;font-size:.8rem;font-weight:400;color:var(--mut)}
.hs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 14px 10px}
.hs::-webkit-scrollbar{display:none}
.h{flex:0 0 auto;width:58px;display:grid;justify-items:center;gap:2px;font-size:.78rem}
.h b{font-size:1rem;direction:ltr}
.h u{text-decoration:none;font-size:.66rem;color:#2f7de0;min-height:1em}
.scene{position:relative;height:120px}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.box{padding:10px 12px;border-radius:14px;border-inline-start:4px solid #3b9be6;background:var(--info);font-size:.9rem;line-height:1.8;font-weight:700}
.box.dust{border-color:#e2a03f;background:var(--dust)}
.box b{display:block}
.box small{display:block;font-weight:400;font-size:.72rem;color:var(--mut)}
.trend{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--card);font-size:.92rem}
.trend span{font-size:1.4rem}
.days{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;width:84px;padding:9px 4px;border-radius:18px;border:2px solid transparent;background:var(--card);display:grid;justify-items:center;gap:2px;font-size:.8rem}
.d.on{border-color:var(--sel)}
.d b{font-size:.84rem}
.d em{font-style:normal;direction:ltr;font-size:.84rem}
.d em s{text-decoration:none;color:var(--mut)}
.rows{border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.row summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 4px;cursor:pointer;font-size:1.02rem}
.row summary::-webkit-details-marker{display:none}
.ri{width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:1.3rem;flex:none}
.rl{flex:1}
.rl i{font-style:normal;color:var(--mut);margin:0 4px}
.ch{color:var(--mut);transition:transform .25s}
.row[open] .ch{transform:rotate(180deg)}
.rd{padding:0 62px 12px 4px;font-size:.88rem;color:var(--mut)}
.foot{text-align:center;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:3px}
.foot .p{font-weight:800;font-size:.88rem}
.foot .by{font-family:"Aref Ruqaa",Tahoma,Arial,sans-serif;font-weight:700;color:var(--gold);font-size:1.15rem}
.foot a.go{justify-self:center;margin-top:4px;padding:5px 16px;border-radius:999px;background:var(--gold);color:#2b1c0c;font-weight:900;font-size:.85rem;text-decoration:none}
.foot small{color:var(--mut);font-size:.72rem}
@media(prefers-reduced-motion:reduce){#ref{transition:none}.ch{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
 <header class="hd">
  <div><h1>طقس الشرقاط</h1><div class="sub" id="date"></div></div>
  <div class="hr"><span id="clk" dir="ltr">--:--</span><button id="ref" type="button" aria-label="تحديث البيانات">↻</button></div>
 </header>

 <section class="now" aria-live="polite">
  <div class="nt">
   <div class="lbl">الآن <span class="live" id="live">جارٍ التحميل…</span></div>
   <div class="nm">
    <div class="tmp"><span id="ico"></span><b id="temp">--°</b></div>
    <div class="cd"><div id="desc">جارٍ جلب حالة الطقس</div><small id="feels"></small></div>
   </div>
  </div>
  <div class="hs" id="hs"></div>
  <div class="scene"><canvas id="fx" aria-hidden="true"></canvas></div>
 </section>

 <div class="box" id="alert" role="alert" hidden></div>
 <div class="box dust" id="dustBox" role="status" hidden></div>
 <div class="trend" id="trend" hidden><span id="tra"></span><div id="trt"></div></div>
 <div class="days" id="days"></div>
 <div class="rows" id="rows"></div>

 <div class="foot">
  <div class="p">مرحباً بكم في موقع الشرقاط الثقافي</div>
  <div class="by">تصميم وإعداد محمد علي أحمد الحطاب الجبوري</div>
  <a class="go" href="https://mhamalgporee-ctrl.github.io/" target="_blank" rel="noopener noreferrer">اضغط هنا لمعاينة الموقع</a>
  <small id="src"></small>
  <small>البيانات نموذجية وليست قياسات محطة أرضية أو إنذاراً رسمياً · تتحدث كل 10 دقائق</small>
 </div>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
if(parent===window)document.documentElement.classList.add("standalone");
const LAT=35.5036,LON=43.2325,TZ="Asia/Baghdad",OFF=3*3600;
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const URL_MET=`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${LAT}&lon=${LON}`;
const URL_DUST=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=dust,aerosol_optical_depth,pm10&hourly=dust,aerosol_optical_depth,pm10&domains=cams_global&forecast_days=2&timezone=${encodeURIComponent(TZ)}`;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const num=v=>(v===null||v===undefined||v==="")?NaN:Number(v), fin=Number.isFinite;
let S=null,SEL=0,loading=false,retryT=0,thunderSoon=false,hasData=false;

/* ---------- حساب الشروق والغروب ---------- */
function sunTimes(ms){
 const rad=Math.PI/180,loc=new Date(ms+OFF*1000),y=loc.getUTCFullYear(),m=loc.getUTCMonth(),dd=loc.getUTCDate();
 const midnight=Date.UTC(y,m,dd),N=Math.floor((midnight-Date.UTC(y,0,1))/864e5)+1,g=2*Math.PI/365*(N-1);
 const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
 const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
 const lat=LAT*rad,c=Math.cos(90.833*rad)/(Math.cos(lat)*Math.cos(decl))-Math.tan(lat)*Math.tan(decl),ha=Math.acos(Math.max(-1,Math.min(1,c)))/rad,noon=720-4*LON-eqt;
 return{sr:midnight+(noon-4*ha)*60000,ss:midnight+(noon+4*ha)*60000};
}
const isNight=ms=>{const s=sunTimes(ms);return ms<s.sr||ms>s.ss};

/* ---------- تصنيف الحالة (نفس منطق البرنامج) ---------- */
const kindOf=s=>{s=String(s||"");return /thunder/.test(s)?"thunder":/snow/.test(s)?"snow":/rain|sleet|drizzle/.test(s)?"rain":/fog/.test(s)?"fog":"none"};
const symOf=e=>e.data.next_1_hours?.summary?.symbol_code??e.data.next_6_hours?.summary?.symbol_code??e.data.next_12_hours?.summary?.symbol_code??"";
function precipPeriod(e){
 for(const [k,h] of [["next_1_hours",1],["next_6_hours",6],["next_12_hours",12]]){
  const v=e.data[k]?.details?.precipitation_amount;
  if(v!==undefined&&v!==null)return{mm:Math.max(0,num(v)||0),hours:h};
 }
 return{mm:0,hours:0};
}
function effOf(d){
 const lo=num(d.cloud_area_fraction_low),mi=num(d.cloud_area_fraction_medium),hi=num(d.cloud_area_fraction_high);
 if([lo,mi,hi].every(fin))return Math.min(100,Math.max(lo,mi)+.25*hi);
 const t=num(d.cloud_area_fraction);return fin(t)?t:0;
}
function cloudWx(e,night){
 if(e<=20)return["clear",night?"سماء صافية ليلاً":"صحو"];
 if(e<=40)return["part","صحو مع غيوم خفيفة"];
 if(e<=65)return["part","غائم جزئياً"];
 if(e<=85)return["cloud","غائم غالباً"];
 return["cloud","غائم"];
}
function wxOf(e,night){
 const d=e.data.instant.details,k=kindOf(symOf(e)),pr=precipPeriod(e).mm,eff=effOf(d);
 if(k==="thunder")return["storm","احتمال عواصف رعدية خلال الساعة"];
 if(k==="snow")return["snow","ثلوج"];
 if((k==="rain"||pr>=.8)&&eff>=60)return["rain",pr>=1.5?"أمطار متوقعة":"احتمال زخات مطر خفيفة"];
 if(pr>=.3)return["part","غائم جزئياً"];
 if(k==="fog")return["fog","ضباب"];
 return cloudWx(eff,night);
}

/* ---------- أيقونات أصلية ---------- */
let uid=0;
function ic(k,night,s=36){
 const id="m"+uid++;
 const sun=(x,y,q)=>`<g transform="translate(${x} ${y}) scale(${q})"><circle r="8" fill="#ffc233"/><circle r="12.5" fill="none" stroke="#ffc233" stroke-width="3" stroke-dasharray="3 5.4" stroke-linecap="round"/></g>`;
 const moon=(x,y,q)=>`<g transform="translate(${x} ${y}) scale(${q})"><mask id="${id}"><rect x="-20" y="-20" width="40" height="40" fill="#fff"/><circle cx="7" cy="-5" r="9" fill="#000"/></mask><circle r="11" fill="#e9d98f" mask="url(#${id})"/></g>`;
 const cl=f=>`<g transform="translate(0 -4)" fill="${f}"><circle cx="19" cy="34" r="7"/><circle cx="29" cy="28" r="10"/><circle cx="40" cy="34" r="7"/><rect x="19" y="34" width="21" height="7"/></g>`;
 let b;
 if(k==="clear")b=night?moon(28,26,1.6):sun(28,26,1.5);
 else if(k==="part")b=(night?moon(19,17,1):sun(19,17,1))+cl("#c9d3e0");
 else if(k==="cloud")b=cl("#b7c3d3");
 else if(k==="fog")b=cl("#b7c3d3")+'<path d="M14 42h28M18 47h24" stroke="#9aa7b8" stroke-width="3" stroke-linecap="round"/>';
 else if(k==="rain")b=cl("#9fb0c6")+'<path d="M21 41l-2 5M30 41l-2 5M39 41l-2 5" stroke="#3b8fe8" stroke-width="2.6" stroke-linecap="round"/>';
 else if(k==="snow")b=cl("#c9d3e0")+'<g fill="#6aa8ff"><circle cx="21" cy="44" r="2"/><circle cx="30" cy="47" r="2"/><circle cx="39" cy="44" r="2"/></g>';
 else if(k==="wind")b='<path d="M8 18h28a5 5 0 1 0-5-5M8 27h34a5 5 0 1 1-5 5M8 36h20" stroke="#4fb3b6" stroke-width="3" fill="none" stroke-linecap="round"/>';
 else b=cl("#8795aa")+'<path d="M31 33l-6 9h5l-2 6 8-10h-5z" fill="#ffc933"/>';
 return `<svg viewBox="0 0 56 52" width="${s}" height="${s*52/56}" aria-hidden="true">${b}</svg>`;
}

/* ---------- الأوقات والنصوص ---------- */
const dayKey=ms=>new Date(ms+OFF*1000).toISOString().slice(0,10);
const hrFmt=new Intl.DateTimeFormat("ar-IQ-u-nu-latn",{timeZone:TZ,hour:"numeric",hour12:true});
const tmFmt=new Intl.DateTimeFormat("ar-IQ-u-nu-latn",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true});
const dateFmt=new Intl.DateTimeFormat("ar-IQ",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
const clkFmt=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const timeLabel=ms=>tmFmt.format(new Date(ms));
const uvTxt=u=>u<3?"منخفض":u<6?"معتدل":u<8?"مرتفع":u<11?"مرتفع جداً":"شديد";
function tick(){
 const p={};clkFmt.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
 const h=+p.hour%24;$("clk").textContent=String(h%12||12).padStart(2,"0")+":"+p.minute+(h<12?" ص":" م");
 $("date").textContent=dateFmt.format(new Date());
}
setInterval(tick,1000);tick();

/* ---------- التوقعات اليومية ---------- */
function buildDaily(ts,now){
 const D={};
 for(const e of ts){
  const t=Date.parse(e.time);if(!fin(t))continue;
  const key=dayKey(t),o=D[key]||(D[key]={n:0,hi:-Infinity,lo:Infinity,pr:0,wind:0,gust:0,cl:[],hum:[],pres:[],uv:0,prob:NaN,th:false,sn:false,es:[]});
  const d=e.data.instant.details;o.n++;o.es.push(e);
  const tt=num(d.air_temperature);if(fin(tt)){o.hi=Math.max(o.hi,tt);o.lo=Math.min(o.lo,tt)}
  const n6=e.data.next_6_hours?.details;
  if(n6&&!e.data.next_1_hours){const mx=num(n6.air_temperature_max),mn=num(n6.air_temperature_min);if(fin(mx))o.hi=Math.max(o.hi,mx);if(fin(mn))o.lo=Math.min(o.lo,mn)}
  const ws=num(d.wind_speed)*3.6;if(fin(ws))o.wind=Math.max(o.wind,ws);
  const g=num(d.wind_speed_of_gust)*3.6;if(fin(g))o.gust=Math.max(o.gust,g);
  const hh=new Date(t+OFF*1000).getUTCHours();if(hh>=7&&hh<=17)o.cl.push(effOf(d));
  const hu=num(d.relative_humidity);if(fin(hu))o.hum.push(hu);
  const pp=num(d.air_pressure_at_sea_level);if(fin(pp))o.pres.push(pp);
  const uc=num(d.ultraviolet_index_clear_sky);if(fin(uc))o.uv=Math.max(o.uv,uc*(1-.75*Math.pow(effOf(d)/100,3.4)));
  o.pr+=precipPeriod(e).mm;
  const pb=num((e.data.next_6_hours||e.data.next_1_hours)?.details?.probability_of_precipitation);
  if(fin(pb))o.prob=fin(o.prob)?Math.max(o.prob,pb):pb;
  const k=kindOf(symOf(e));if(k==="thunder")o.th=true;if(k==="snow")o.sn=true;
 }
 const today=dayKey(now),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
 return Object.keys(D).sort().filter(k=>k>=today&&D[k].n>=3&&fin(D[k].hi)).slice(0,5).map(k=>{
  const o=D[k];let w;
  if(o.th)w=["storm","احتمال رعد"];
  else if(o.sn)w=["snow","ثلوج"];
  else if(o.pr>=3)w=["rain","أمطار متوقعة"];
  else if(o.pr>=.5)w=["rain","زخات مطر"];
  else if(o.wind>=45)w=["wind","نشاط رياح"];
  else w=cloudWx(o.cl.length?avg(o.cl):0,false);
  const noon=Date.parse(k+"T09:00:00Z");
  return{key:k,hi:Math.round(o.hi),lo:Math.round(o.lo),k:w[0],txt:w[1],dn:new Date(k+"T00:00:00Z").getUTCDay(),
   mm:o.pr,prob:o.prob,wind:Math.round(o.wind),gust:Math.round(o.gust),hum:Math.round(avg(o.hum)),pres:Math.round(avg(o.pres)),uv:o.uv,es:o.es,sun:sunTimes(noon)};
 });
}

/* ---------- التنبيهات (نفس شروط البرنامج) ---------- */
function buildAlert(ts,ci,now){
 const limit=now+18*3600e3;let gust=0,th=null,rn=null,heavy=false,tot=0;
 for(let i=ci;i<ts.length;i++){
  const e=ts[i],st=Date.parse(e.time);if(!fin(st)||st>limit)break;
  const d=e.data.instant.details,k=kindOf(symOf(e)),p=precipPeriod(e),du=p.hours||1;
  const g=num(d.wind_speed_of_gust),w=num(d.wind_speed);
  gust=Math.max(gust,(fin(g)?g:(fin(w)?w*1.4:0))*3.6);
  if(k==="thunder"&&!th)th=st;
  if((k==="rain"||p.mm>=.5)&&!rn)rn=st;
  if((p.mm>=7.5&&du<=3)||(p.mm>=10&&du<=6))heavy=true;
  if(p.mm>0)tot+=p.mm;
 }
 thunderSoon=th!==null&&th<=now+3600e3;
 const parts=[];
 if(th)parts.push("⛈️ يُحتمل حدوث أمطار رعدية في الشرقاط "+(th<=now+30*60e3?"خلال نصف ساعة تقريباً":"ابتداءً من "+timeLabel(th)));
 if(rn&&!th)parts.push("🌧️ يُتوقع هطول أمطار في الشرقاط ابتداءً من "+timeLabel(rn));
 if(heavy)parts.push("🌧️ قد تكون بعض الهطولات غزيرة؛ الكمية المتوقعة ضمن الفترة القريبة نحو "+tot.toFixed(1)+" ملم");
 if(gust>=65)parts.push("💨 هبات رياح نشطة تصل إلى "+Math.round(gust)+" كم/س");
 else if(gust>=45)parts.push("💨 رياح نشطة نسبياً تصل سرعتها إلى "+Math.round(gust)+" كم/س");
 return parts.join(" · ");
}
function buildDust(data,now,windKmh){
 const h=data?.hourly;if(!h||!Array.isArray(h.time)||!Array.isArray(h.dust))throw Error("CAMS dust data missing");
 const rows=h.time.map((t,i)=>({time:Date.parse(t),dust:num(h.dust[i])})).filter(x=>fin(x.time)&&fin(x.dust)&&x.time>=now-30*60e3&&x.time<=now+6*3600e3);
 if(!rows.length)return null;
 const cur=rows[0].dust,peak=rows.reduce((a,b)=>b.dust>a.dust?b:a,rows[0]);
 if((cur<750&&peak.dust<750)||(windKmh&&windKmh<25))return null;
 return{peak:peak.dust,time:peak.time};
}
function renderDust(d){
 const el=$("dustBox");
 if(!d){el.hidden=true;el.innerHTML="";return}
 el.hidden=false;
 el.innerHTML=`<b>🌫️ تنبيه عاصفة غبارية قوية ومؤثرة</b>يتوقع تأثر المنطقة بعاصفة غبارية قوية وارتفاع الغبار السطحي المؤثر على الرؤية إلى ${Math.round(d.peak)} ميكروغرام/م³ تقريباً عند ${timeLabel(d.time)}.<small>المصدر: CAMS Global عبر Open-Meteo</small>`;
}

/* ---------- جلب البيانات ---------- */
function getJSON(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);return fetch(u,{signal:c.signal}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).finally(()=>clearTimeout(t))}
async function load(){
 if(loading)return;loading=true;
 try{
  const [rm,rd]=await Promise.allSettled([getJSON(URL_MET),getJSON(URL_DUST)]);
  if(rm.status!=="fulfilled")throw Error("تعذر جلب بيانات MET Norway");
  const ts=rm.value?.properties?.timeseries;if(!Array.isArray(ts)||ts.length<20)throw Error("بيانات الطقس غير مكتملة");
  const now=Date.now();let ci=0,best=Infinity;
  ts.forEach((e,i)=>{const dt=Math.abs(Date.parse(e.time)-now);if(dt<best){best=dt;ci=i}});
  const cur=ts[ci],d=cur.data.instant.details,t=num(d.air_temperature);
  if(!fin(t))throw Error("بيانات الحرارة غير متوفرة");
  const hu=fin(num(d.relative_humidity))?num(d.relative_humidity):50,ws=num(d.wind_speed)||0,windKmh=Math.round(ws*3.6);
  const e=(hu/100)*6.105*Math.exp(17.27*t/(237.7+t));
  let dust=null;
  if(rd.status==="fulfilled"){try{dust=buildDust(rd.value,now,windKmh)}catch(x){console.warn("CAMS dust:",x)}}
  const day=buildDaily(ts,now);
  S={now,ts,ci,t:Math.round(t),f:Math.round(t+.33*e-.7*ws-4),w:windKmh,h:Math.round(hu),p:Math.round(num(d.air_pressure_at_sea_level)||0),
     eff:effOf(d),wx:wxOf(cur,isNight(now)),night:isNight(now),days:day,alert:buildAlert(ts,ci,now),dust,stale:false};
  hasData=true;SEL=0;clearTimeout(retryT);
 }catch(err){
  console.error("Weather:",err);
  if(hasData){S.stale=true;clearTimeout(retryT);retryT=setTimeout(load,60000)}
  else{S=null;$("live").textContent="تعذر الاتصال بخدمة الطقس";$("live").classList.add("off");$("desc").textContent="الطقس غير متاح الآن";clearTimeout(retryT);retryT=setTimeout(load,30000)}
 }finally{loading=false;render()}
}

/* ---------- العرض ---------- */
const row=(ico,label,val,detail,open)=>`<details class="row"><summary><span class="ri">${ico}</span><span class="rl">${label}<i>•</i>${val}</span><span class="ch">⌄</span></summary><div class="rd">${detail}</div></details>`;
function render(){
 if(!S)return;
 const w=S.wx;
 $("ico").innerHTML=ic(w[0],S.night,58);
 $("temp").textContent=S.t+"°";
 $("desc").textContent=w[1];
 $("feels").textContent="الحرارة المحسوسة: "+S.f+"°";
 $("live").textContent=S.stale?"تعذر التحديث · آخر بيانات متاحة":"محدَّث";
 $("live").classList.toggle("off",S.stale);
 $("alert").textContent=S.alert;$("alert").hidden=!S.alert;
 renderDust(S.dust);
 const dl=S.days;
 if(dl.length>3){
  const a=(dl[1].hi+dl[2].hi+dl[3].hi)/3,df=a-dl[0].hi;
  $("tra").textContent=df<-1.5?"↘":df>1.5?"↗":"→";
  $("trt").textContent="من المتوقع أن "+(df<-1.5?"تنخفض":df>1.5?"ترتفع":"تبقى مستقرة نسبياً")+" درجة الحرارة خلال الأيام الـ3 المقبلة.";
  $("trend").hidden=false;
 }else $("trend").hidden=true;
 renderSel();
 $("src").textContent="📡 المصدر: MET Norway · توقعات نموذج جوي لمركز القضاء";
 setScene(w[0],S.night,S.eff);
}
function renderSel(){
 const dl=S.days,D=dl[SEL]||dl[0];if(!D)return;
 $("days").innerHTML=dl.map((x,i)=>`<button class="d${i===SEL?" on":""}" data-i="${i}" type="button"><b>${i?DAYS[x.dn]:"اليوم"}</b>${ic(x.k,false,34)}<em>${x.hi}°/<s>${x.lo}°</s></em></button>`).join("");
 /* الساعات */
 let es=D.es;if(!SEL)es=es.filter(e=>Date.parse(e.time)>=S.now-30*60e3).slice(0,24);
 $("hs").innerHTML=es.map((e,j)=>{
  const t=Date.parse(e.time),x=wxOf(e,isNight(t)),pb=num((e.data.next_1_hours||e.data.next_6_hours)?.details?.probability_of_precipitation);
  return `<div class="h"><b>${Math.round(num(e.data.instant.details.air_temperature))}°</b>${ic(x[0],isNight(t),32)}<u>${fin(pb)&&pb>=20?"💧"+Math.round(pb)+"%":""}</u><span>${!SEL&&!j?"الآن":hrFmt.format(new Date(t))}</span></div>`;
 }).join("");
 /* التفاصيل */
 const cur=!SEL,wind=cur?S.w:D.wind,hum=cur?S.h:D.hum,pres=cur?S.p:D.pres;
 const rain=fin(D.prob)?Math.round(D.prob)+"%":D.mm.toFixed(1)+" ملم";
 $("rows").innerHTML=
  row("🌧️","الأمطار",rain,`الكمية المتوقعة خلال اليوم: ${D.mm.toFixed(1)} ملم`)+
  row("💨","الرياح",wind+" كم/س",`أقصى سرعة متوقعة: ${D.wind} كم/س${D.gust?" · هبات حتى "+D.gust+" كم/س":""}`)+
  row("💧","الرطوبة",hum+"%","متوسط الرطوبة النسبية خلال اليوم: "+D.hum+"%")+
  row("☀️","الأشعة فوق البنفسجية",Math.round(D.uv)+" ("+uvTxt(D.uv)+")","أعلى قيمة متوقعة خلال النهار")+
  row("🧭","الضغط الجوي",pres+" hPa","الضغط عند مستوى سطح البحر")+
  row("🌅","الشروق والغروب",timeLabel(D.sun.sr)+" · "+timeLabel(D.sun.ss),"بتوقيت بغداد");
}
$("days").addEventListener("click",e=>{const b=e.target.closest(".d");if(!b||!S)return;SEL=+b.dataset.i;renderSel()});
$("ref").addEventListener("click",()=>{const r=$("ref");r.classList.add("spin");setTimeout(()=>r.classList.remove("spin"),600);load()});

/* ---------- المشهد المتحرك ---------- */
const cv=$("fx"),cx=cv.getContext("2d");
let W=300,H=120,CL=[],P=[],ST=[],flash=0,raf=0,mode="clear",night=false,cov=0,onScreen=true;
const SK={day:{clear:["#2f80d8","#8fd0f7"],part:["#3b86d4","#9ccdee"],cloud:["#62778c","#aab8c6"],fog:["#8c969f","#c2c8cd"],rain:["#3f4e60","#74849a"],snow:["#7f90a3","#cdd6e0"],storm:["#2b3342","#566074"],wind:["#3b86d4","#9ccdee"]},
 night:{clear:["#0a1130","#2b3b70"],part:["#0e1736","#2f3f72"],cloud:["#1b2233","#3b4659"],fog:["#2b3138","#4d555d"],rain:["#111826","#2d3b4d"],snow:["#2a3445","#56667b"],storm:["#0d111b","#283040"],wind:["#0e1736","#2f3f72"]}};
function sizeScene(){const r=cv.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width||300;H=r.height||120;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function setScene(k,n,eff){
 mode=k;night=n;cov=k==="clear"?0:k==="rain"||k==="storm"?Math.max(.9,eff/100):Math.min(1,eff/100);
 sizeScene();const R=Math.random;
 ST=[...Array(40)].map(()=>({x:R()*W,y:R()*H*.6,r:R()*1.2+.3,p:R()*6}));
 CL=[...Array(Math.round(cov*6))].map(()=>({x:R()*W,y:R()*H*.45+6,s:R()*50+45,v:R()*.15+.05}));
 P=[...Array(k==="rain"?70:k==="storm"?100:k==="snow"?45:0)].map(()=>({x:R()*W,y:R()*H,v:R()*3+(k==="snow"?1:8)}));
 draw(0);startLoop();
}
function hill(y,a,f,c){cx.fillStyle=c;cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=8)cx.lineTo(x,y+Math.sin(x/f)*a);cx.lineTo(W,H);cx.fill()}
function draw(t){
 const pal=SK[night?"night":"day"][mode]||SK.day.clear,g=cx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(night&&cov<.6){cx.fillStyle="#fff";ST.forEach(s=>{cx.globalAlpha=(.3+.7*Math.abs(Math.sin(t/900+s.p)))*(1-cov);cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()});cx.globalAlpha=1}
 const vis=1-cov*.65,sx=W*.2,sy=H*.32;
 if(!night){const r=cx.createRadialGradient(sx,sy,2,sx,sy,60);r.addColorStop(0,`rgba(255,235,150,${.95*vis})`);r.addColorStop(1,"rgba(255,235,150,0)");cx.fillStyle=r;cx.fillRect(0,0,W,H)}
 else{cx.globalAlpha=vis;cx.fillStyle="#f1f1e6";cx.beginPath();cx.arc(sx,sy,15,0,6.3);cx.fill();cx.globalAlpha=1}
 cx.fillStyle=night?"rgba(120,135,165,.35)":"rgba(255,255,255,.4)";
 CL.forEach(c=>{if(!reduce){c.x+=c.v;if(c.x-c.s>W)c.x=-c.s}cx.beginPath();cx.ellipse(c.x,c.y,c.s,c.s*.3,0,0,6.3);cx.ellipse(c.x+c.s*.4,c.y-c.s*.14,c.s*.6,c.s*.28,0,0,6.3);cx.fill()});
 hill(H*.74,7,38,night?"rgba(18,26,44,.6)":"rgba(40,78,70,.5)");hill(H*.88,5,24,night?"rgba(8,13,26,.85)":"rgba(26,56,50,.85)");
 if(P.length){
  cx.strokeStyle="rgba(190,220,255,.75)";cx.fillStyle="#fff";cx.lineWidth=1.2;
  P.forEach(p=>{
   if(!reduce){p.y+=p.v;if(mode==="snow")p.x+=Math.sin(p.y/20);else p.x-=1.4;if(p.y>H){p.y=-10;p.x=Math.random()*W}}
   if(mode==="snow"){cx.beginPath();cx.arc(p.x,p.y,1.8,0,6.3);cx.fill()}else{cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+1.4,p.y-9);cx.stroke()}
  });
 }
 if(mode==="fog"){cx.fillStyle="rgba(255,255,255,.2)";cx.fillRect(0,H*.4,W,H*.6)}
 if(mode==="storm"&&!reduce){if(thunderSoon&&Math.random()<.004)flash=1;if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash*.35})`;cx.fillRect(0,0,W,H);flash-=.08}}
}
function loop(t){draw(t);raf=requestAnimationFrame(loop)}
function startLoop(){if(!raf&&!reduce&&onScreen&&!document.hidden)raf=requestAnimationFrame(loop)}
function stopLoop(){cancelAnimationFrame(raf);raf=0}
if("IntersectionObserver"in window)new IntersectionObserver(es=>{onScreen=es[0].isIntersecting;onScreen?startLoop():stopLoop()}).observe(cv.parentElement);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopLoop();else{startLoop();load()}});
let rs=0;addEventListener("resize",()=>{clearTimeout(rs);rs=setTimeout(()=>{if(S)setScene(S.wx[0],S.night,S.eff);else sizeScene()},150)});

/* ---------- ارتفاع الإطار والتطبيق ---------- */
let lastH=0;
function postHeight(){if(parent===window)return;const h=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(h-lastH)>2){lastH=h;parent.postMessage({wxHeight:h},"*")}}
if("ResizeObserver"in window)new ResizeObserver(postHeight).observe($("wrap"));
addEventListener("load",postHeight);
if("serviceWorker"in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(err=>console.error("SW:",err))});
setInterval(load,10*60*1000);
sizeScene();load();
</script>
</body>
