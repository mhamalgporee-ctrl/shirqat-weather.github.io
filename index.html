<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2137">
<meta name="description" content="طقس الشرقاط: الحالة الجوية والتوقعات والتنبيهات خلال الساعات والأيام القادمة">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="طقس الشرقاط">
<title>طقس الشرقاط المباشر</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5b02e;--gold2:#ffd166;--muted:#eaf3ff;--line:rgba(255,255,255,.18)}
*,*::before,*::after{box-sizing:border-box}
html{background:#0d2137}
body{margin:0;padding:4px 10px 8px;font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif;color:#fff;background:transparent;line-height:1.4}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:4px;position:relative;z-index:1;text-shadow:0 0 3px #000b,0 1px 10px #000b}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:4px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:12px;min-width:0}
.title .ico{font-size:1.4rem;filter:drop-shadow(0 0 12px #ffc83c99)}
h1{margin:0;font-size:clamp(.9rem,3vw,1.25rem);font-weight:900;color:#ffe08a;line-height:1.35}
.ctrl{display:flex;gap:10px;align-items:center}
.refresh{width:34px;height:34px;border:0;background:none;font-size:1.5rem;transition:transform .6s}
.refresh.spin{transform:rotate(360deg)}
.grid{display:grid;grid-template-columns:1fr 1.75fr;gap:6px;align-items:start}
.fc{order:1;padding:4px 7px;border-radius:16px;background:linear-gradient(180deg,#12304fcc,#0e2540cc);border:1px solid var(--line);box-shadow:0 8px 24px #0006}
.current{order:2;padding:2px 0;display:flex;flex-direction:column;justify-content:space-between}
.live{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:#22e05a;box-shadow:0 0 10px #22e05a;animation:pulse 1.4s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.alert{margin:4px 0;padding:10px 12px;border-inline-start:4px solid #67c7ff;background:#12486dcc;border-radius:8px;font-weight:700;font-size:.95rem;line-height:1.7}
.alert.warning{border-color:#67c7ff;background:#12486dcc}
.alert.severe{border-color:#67c7ff;background:#12486dcc}
.alert.info{border-color:#67c7ff;background:#12486dcc}
.dustbox{margin:4px 0;padding:10px 12px;border:1px solid #8bc8e8;border-inline-start:4px solid #8bc8e8;border-radius:8px;background:#12394dcc;font-size:.9rem;line-height:1.7}
.dustbox.warning{border-color:#8bc8e8;background:#12394dcc}
.dustbox.severe{border-color:#ff6b6b;background:#5a1f1fcc}
.dustbox b{display:block;font-size:.95rem;color:#ffe08a}
.dustbox small{display:block;color:#eaf3ff;font-size:.73rem}
.cur-main{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0}
.city{font-size:clamp(1.3rem,4.2vw,2rem);font-weight:900;margin:0;line-height:1.15}
.date{font-weight:700;color:#eaf3ff;font-size:.85rem}
.big{display:flex;align-items:center;gap:12px}
.hero{width:clamp(2.8rem,9vw,5rem);height:clamp(2.8rem,9vw,5rem);display:grid;place-items:center;font-size:clamp(2.4rem,8vw,4.2rem);filter:drop-shadow(0 0 20px #ffffff66);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sun{position:relative;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc61a 55%,#f59e0b);box-shadow:0 0 40px 12px #ffc828b3}
.sun:before{content:"";position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(#ffdc5080 0 6deg,transparent 6deg 24deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.temp{font-size:clamp(2rem,6.5vw,3.4rem);font-weight:900;line-height:1;direction:ltr;white-space:nowrap}
.desc{font-size:clamp(1.2rem,4vw,1.55rem);font-weight:900;color:var(--gold2);text-align:end}
.descrow{display:flex;align-items:center;justify-content:flex-start;gap:8px}
.descrow .desc{flex-shrink:0}
.stats-header{display:grid;grid-template-columns:repeat(4,1fr);margin-top:4px;padding:0 2px 2px}
.feels{grid-column:4;text-align:center;font-size:.82rem;font-weight:800;color:#fff;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:4px}
.stat{text-align:center;padding:2px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat .i{font-size:.95rem;line-height:1.25}
.stat .t{font-size:.7rem;font-weight:800}
.stat .v{font-size:.8rem;font-weight:900;overflow-wrap:anywhere}
.fc h2{margin:0 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line);font-size:1.15rem;font-weight:900}
.fc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 10px;border:1px solid var(--gold);border-radius:10px;background:rgba(245,176,46,.12);font-size:1rem;font-weight:900;color:var(--gold2);-webkit-tap-highlight-color:transparent}
.fc-btn:active{background:rgba(245,176,46,.25)}
.fc-btn .arrow{font-size:.85rem;transition:transform .3s ease}
.fc-btn.open .arrow{transform:rotate(180deg)}
.fc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.fc-wrap.open{grid-template-rows:1fr;margin-top:4px}
.fc-inner{overflow:hidden;min-height:0}
#fcList{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:6px;padding:1px 10px;min-height:30px;border-radius:9px;border:1px solid #ffffff30;box-shadow:0 2px 8px #0004;text-shadow:0 1px 3px #000c}
.row .ic{font-size:1rem;width:24px;text-align:center}
.row .d{flex:1;min-width:0;line-height:1.1;display:flex;align-items:baseline;gap:6px}
.row .d b{font-weight:900;font-size:.85rem}
.row .d span{font-size:.75rem;font-weight:700}
.row .tp{direction:ltr;font-weight:900;font-size:.9rem;white-space:nowrap}
.hi{color:#ffe28a}.lo{color:#d3ebff}
.r-sunny{background:linear-gradient(120deg,#1c6fc0,#3b9be6 55%,#7cc5f5)}
.r-partly{background:linear-gradient(120deg,#2f78bd,#6aa9dc)}
.r-cloudy{background:linear-gradient(120deg,#52677f,#7d92a8)}
.r-rain{background:repeating-linear-gradient(105deg,#bedcff55 0 1px,transparent 1px 11px),linear-gradient(120deg,#26384f,#3c556f)}
.r-wind{background:linear-gradient(120deg,#1f7f86,#4fb3b6)}
.r-snow{background:linear-gradient(120deg,#5f7d9c,#a9c1d8)}
.note{font-size:.75rem;color:#eaf3ff;font-weight:700;margin-top:2px}
.banner{text-align:center;padding:5px 0 0;border-top:1px solid var(--line)}
.banner .pill{font-weight:800;font-size:.88rem;margin-bottom:2px}
.banner .by{font-family:"Aref Ruqaa",Tahoma,Arial,sans-serif;font-weight:700;color:var(--gold2);font-size:1.1rem;line-height:1.3;text-shadow:0 0 4px #000e,0 2px 12px #000b}
.digital-clock{flex-shrink:0;min-width:96px;padding:4px 8px;border-radius:12px;background:linear-gradient(#0b121b,#05090f);border:2px solid var(--gold);box-shadow:0 0 15px #f5b02e4d,inset 0 0 10px #000c;text-align:center;text-shadow:0 0 10px #ffd16699;font-variant-numeric:tabular-nums;line-height:1.25}
.dc-main{display:flex;align-items:baseline;justify-content:center;gap:5px;color:var(--gold2);font-weight:900}
#dcHM{font-size:1.35rem;line-height:1.1}
.dc-s{font-size:.8rem;color:#ff6b5e;min-width:1.3em}
.dc-ap{font-size:.7rem;color:#eaf3ff;margin-top:2px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.current{order:1}.fc{order:2}.standalone .wrap{min-height:calc(100vh - 12px);min-height:calc(100dvh - 12px)}.standalone .grid{flex:1;display:flex;flex-direction:column}.standalone .current{flex:1}.standalone .fc{flex:none}}
@media(max-width:600px){body{padding:6px 10px 8px}header{flex-wrap:nowrap;gap:8px}.title{gap:8px}.ctrl{gap:6px;flex-shrink:0}.digital-clock{min-width:80px;padding:3px 6px}#dcHM{font-size:1.2rem}.dc-ap{margin-top:0}}
@media(prefers-reduced-motion:reduce){.dot,.hero,.sun:before{animation:none}.refresh{transition:none}.fc-wrap,.fc-btn .arrow{transition:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
<header>
 <div class="title"><div class="ico">🌤️</div><div><h1>طقس الشرقاط المباشر</h1></div></div>
 <div class="ctrl">
  <div class="digital-clock" id="digitalClock" title="الوقت الحالي بتوقيت بغداد" dir="ltr">
   <div class="dc-main"><span id="dcHM">--:--</span><span class="dc-s" id="dcS">--</span></div>
   <div class="dc-ap" id="dcAP"></div>
  </div>
  <button class="refresh" id="ref" type="button" title="تحديث البيانات" aria-label="تحديث البيانات">↻</button>
 </div>
</header>
<div class="grid">
 <aside class="fc">
  <button class="fc-btn" id="fcToggle" type="button" aria-expanded="false" aria-controls="fcWrap">
   <span>📅 توقعات الـ 5 أيام القادمة</span><span class="arrow">▼</span>
  </button>
  <div class="fc-wrap" id="fcWrap"><div class="fc-inner">
   <div id="fcList"><div class="note">جارٍ تحميل التوقعات...</div></div>
   <div class="note">🕒 تتحدث البيانات تلقائياً كل 10 دقائق</div>
   <div class="note" id="src"></div>
  </div></div>
 </aside>
 <section class="current" aria-live="polite">
  <div>
   <span class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">جارٍ التحميل…</span></span>
   <div class="cur-main">
    <div><h2 class="city" id="cityName">الشرقاط</h2><div class="date" id="date"></div></div>
    <div class="big"><div class="hero" id="hero">🌤️</div><div class="temp" id="temp">--°C</div></div>
   </div>
   <div class="descrow"><div class="desc" id="desc">جارٍ جلب حالة الطقس</div></div>
  </div>

  <div>
   <div class="alert" id="alert" role="alert" hidden></div>
   <div class="dustbox" id="dustBox" role="status" hidden></div>
  </div>

  <div>
   <div class="stats-header">
    <div class="feels" id="feels"></div>
   </div>
   <div class="stats">
    <div class="stat"><div class="i">☀️</div><div class="t">مؤشر UV</div><div class="v" id="uv">--</div></div>
    <div class="stat"><div class="i">🧭</div><div class="t">الضغط</div><div class="v" id="pr">--</div></div>
    <div class="stat"><div class="i">💧</div><div class="t">الرطوبة</div><div class="v" id="hu">--</div></div>
    <div class="stat"><div class="i">🌬️</div><div class="t">الرياح</div><div class="v" id="wi">--</div></div>
   </div>
  </div>
 </section>
</div>
<div class="banner">
 <div class="pill">مرحباً بكم في موقع الشرقاط الثقافي</div>
 <div class="by">تصميم وإعداد محمد علي أحمد الحطاب الجبوري</div>
 <a href="https://mhamalgporee-ctrl.github.io/" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:5px;padding:4px 14px;font-size:.85rem;border-radius:999px;background:#f5b02e;color:#0d2137;font-weight:900;text-decoration:none;text-shadow:none">اضغط هنا لمعاينة الموقع</a>
</div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
if(parent===window)document.documentElement.classList.add("standalone");
const LAT=35.5036,LON=43.2325,TZ="Asia/Baghdad",CITY="الشرقاط";
const OFF=3*3600,DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== حدود تنبيه الغبار (عدّلها حسب الحاجة) ===== */
const DUST_STRONG=1000;   // ميكروغرام/م³ للغبار الكثيف
const DUST_SEVERE=2000;   // ميكروغرام/م³ للعاصفة الغبارية
const GUST_STRONG=35;     // كم/س هبات رياح مصاحبة
const GUST_SEVERE=45;     // كم/س للعاصفة
const DUST_LEAD_H=6;      // لا يظهر التنبيه إلا إذا بدأ خلال هذه الساعات
const DUST_MIN_HOURS=2;   // أقل عدد ساعات متتالية

const URL_MET=`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${LAT}&lon=${LON}`;
const URL_WTTR=`https://wttr.in/${LAT},${LON}?format=j1`;
const URL_DUST=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=dust,aerosol_optical_depth,pm10&hourly=dust,aerosol_optical_depth,pm10&domains=cams_global&forecast_days=5&timezone=${encodeURIComponent(TZ)}`;
let S=null,mode="sunny",curKey="",thunderSoon=false,loading=false,raf=0,onScreen=true,retryT=0,lastMin="";
const cl01=v=>Math.max(0,Math.min(1,v));
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const num=v=>(v===null||v===undefined||v==="")?NaN:Number(v);

$("fcToggle").addEventListener("click",()=>{
 const open=$("fcWrap").classList.toggle("open");
 $("fcToggle").classList.toggle("open",open);
 $("fcToggle").setAttribute("aria-expanded",open);
});
const clockFmt=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
const dateFmt=new Intl.DateTimeFormat("ar-IQ",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
function updateClock(){
 const p={};clockFmt.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
 const h=Number(p.hour)%24;
 $("dcHM").textContent=String(h%12||12).padStart(2,"0")+":"+p.minute;
 $("dcS").textContent=p.second;$("dcAP").textContent=h<12?"صباحاً":"مساءً";
 if(p.minute!==lastMin){lastMin=p.minute;if(S){$("date").textContent=dateFmt.format(new Date());setFx(liveFx());}}
}
setInterval(updateClock,1000);updateClock();

function sunTimes(ms){
 const rad=Math.PI/180,loc=new Date(ms+OFF*1000),y=loc.getUTCFullYear(),m=loc.getUTCMonth(),dd=loc.getUTCDate();
 const midnight=Date.UTC(y,m,dd),N=Math.floor((midnight-Date.UTC(y,0,1))/864e5)+1,g=2*Math.PI/365*(N-1);
 const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
 const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
 const lat=LAT*rad,c=Math.cos(90.833*rad)/(Math.cos(lat)*Math.cos(decl))-Math.tan(lat)*Math.tan(decl),ha=Math.acos(Math.max(-1,Math.min(1,c)))/rad,noon=720-4*LON-eqt;
 return{sr:midnight+(noon-4*ha)*60000,ss:midnight+(noon+4*ha)*60000};
}
const THUNDER_RE=/thunder/,SNOW_RE=/snow/,RAIN_RE=/rain|sleet|drizzle/,FOG_RE=/fog/;
function kindOf(sym){sym=String(sym||"");if(THUNDER_RE.test(sym))return"thunder";if(SNOW_RE.test(sym))return"snow";if(RAIN_RE.test(sym))return"rain";if(FOG_RE.test(sym))return"fog";return"none";}
const symOf=e=>e.data.next_1_hours?.summary?.symbol_code??e.data.next_6_hours?.summary?.symbol_code??e.data.next_12_hours?.summary?.symbol_code??"";

function precipPeriod(e){
 const one=e.data.next_1_hours?.details?.precipitation_amount;
 if(one!==undefined&&one!==null)return{mm:Math.max(0,num(one)||0),hours:1};
 const six=e.data.next_6_hours?.details?.precipitation_amount;
 if(six!==undefined&&six!==null)return{mm:Math.max(0,num(six)||0),hours:6};
 const twelve=e.data.next_12_hours?.details?.precipitation_amount;
 if(twelve!==undefined&&twelve!==null)return{mm:Math.max(0,num(twelve)||0),hours:12};
 return{mm:0,hours:0};
}
function effOf(d){
 const lo=num(d.cloud_area_fraction_low),mi=num(d.cloud_area_fraction_medium),hi=num(d.cloud_area_fraction_high);
 if([lo,mi,hi].every(Number.isFinite))return Math.min(100,Math.max(lo,mi)+.25*hi);
 const t=num(d.cloud_area_fraction);return Number.isFinite(t)?t:0;
}
function cloudWx(e,daily){
 if(e<=20)return["☀️",daily?"صحو":"سماء صافية وصحو","sunny"];
 if(e<=40)return["🌤️","صحو مع غيوم خفيفة","partly"];
 if(e<=65)return["⛅","غائم جزئياً","partly"];
 if(e<=85)return["🌥️","غائم غالباً","cloudy"];
 return["☁️","غائم","cloudy"];
}
function isClear(){return S.kind==="none"&&S.precip<.2&&S.eff<=20;}
function currentWx(){
 if(S.kind==="thunder")return["⛈️","احتمال عواصف رعدية خلال الساعة","rain"];
 if(S.kind==="snow")return["❄️","ثلوج","snow"];
 if(S.kind==="rain"||S.precip>=.2)return["🌧️",S.precip>=1?"أمطار متوقعة":"احتمال زخات مطر","rain"];
 if(S.kind==="fog")return["🌫️","ضباب","cloudy"];
 return cloudWx(S.eff,false);
}
const uvTxt=u=>u<3?"منخفض":u<6?"معتدل":u<8?"مرتفع":u<11?"مرتفع جداً":"شديد";
const dayKey=ms=>new Date(ms+OFF*1000).toISOString().slice(0,10);
function buildDaily(ts,now){
 const days={};
 for(const e of ts){
  const t=Date.parse(e.time);if(!Number.isFinite(t))continue;
  const key=dayKey(t),o=days[key]||(days[key]={n:0,hi:-Infinity,lo:Infinity,pr:0,wind:0,cl:[],thunder:false,snow:false});
  const d=e.data.instant.details;o.n++;
  const tt=num(d.air_temperature);if(Number.isFinite(tt)){o.hi=Math.max(o.hi,tt);o.lo=Math.min(o.lo,tt);}
  const n6=e.data.next_6_hours?.details;
  if(n6&&!e.data.next_1_hours){const mx=num(n6.air_temperature_max),mn=num(n6.air_temperature_min);if(Number.isFinite(mx))o.hi=Math.max(o.hi,mx);if(Number.isFinite(mn))o.lo=Math.min(o.lo,mn);}
  const ws=num(d.wind_speed)*3.6;if(Number.isFinite(ws))o.wind=Math.max(o.wind,ws);
  const h=new Date(t+OFF*1000).getUTCHours();if(h>=7&&h<=17)o.cl.push(effOf(d));
  o.pr+=precipPeriod(e).mm;
  const k=kindOf(symOf(e));if(k==="thunder")o.thunder=true;if(k==="snow")o.snow=true;
 }
 const today=dayKey(now);
 return Object.keys(days).sort().filter(k=>k>=today&&days[k].n>=3&&Number.isFinite(days[k].hi)).slice(0,5).map(k=>{
  const o=days[k];let info;
  if(o.thunder)info=["⛈️","احتمال رعد","rain"];
  else if(o.snow)info=["❄️","ثلوج","snow"];
  else if(o.pr>=3)info=["🌧️","أمطار متوقعة","rain"];
  else if(o.pr>=.5)info=["🌦️","زخات مطر","rain"];
  else if(o.wind>=45)info=["🌬️","نشاط رياح","wind"];
  else info=cloudWx(o.cl.length?o.cl.reduce((a,b)=>a+b,0)/o.cl.length:0,true);
  return{hi:Math.round(o.hi),lo:Math.round(o.lo),info,dn:new Date(k+"T00:00:00Z").getUTCDay()};
 });
}
function timeLabel(ms){
 return new Intl.DateTimeFormat("ar-IQ",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(ms));
}
function buildAlert(ts,ci,now){
 const limit=now+18*3600e3,events=[];
 let peakGust=0,firstThunder=null,firstRain=null,heavy=false,totalRain=0;
 for(let i=ci;i<ts.length;i++){
  const e=ts[i],start=Date.parse(e.time);if(!Number.isFinite(start)||start>limit)break;
  const d=e.data.instant.details,k=kindOf(symOf(e)),pr=precipPeriod(e);
  const duration=pr.hours||1,end=start+duration*3600e3;
  const g=num(d.wind_speed_of_gust),w=num(d.wind_speed);
  const gust=(Number.isFinite(g)?g:(Number.isFinite(w)?w*1.4:0))*3.6;
  peakGust=Math.max(peakGust,gust);
  if(k==="thunder"&&!firstThunder)firstThunder={start,end};
  if((k==="rain"||pr.mm>=.2)&&!firstRain)firstRain={start,end};
  if(pr.mm>=7.5&&duration<=3)heavy=true;
  if(pr.mm>=10&&duration<=6)heavy=true;
  if(pr.mm>0)totalRain+=pr.mm;
  if(k==="thunder"||k==="rain"||pr.mm>=.2)events.push({start,end,k,mm:pr.mm,hours:duration});
 }
 thunderSoon=!!firstThunder&&firstThunder.start<=now+60*60e3;
 const parts=[];
 if(firstThunder){
  const when=firstThunder.start<=now+30*60e3?"خلال نصف ساعة تقريباً":"ابتداءً من "+timeLabel(firstThunder.start);
  parts.push("⛈️ يُحتمل حدوث أمطار رعدية في الشرقاط "+when);
 }
 if(firstRain&&!firstThunder){
  parts.push("🌧️ يُتوقع هطول أمطار في الشرقاط ابتداءً من "+timeLabel(firstRain.start));
 }
 if(heavy){
  parts.push("🌧️ قد تكون بعض الهطولات غزيرة؛ الكمية المتوقعة ضمن الفترة القريبة نحو "+totalRain.toFixed(1)+" ملم");
 }
 if(peakGust>=65)parts.push("💨 هبات رياح نشطة تصل إلى "+Math.round(peakGust)+" كم/س");
 else if(peakGust>=45)parts.push("💨 رياح نشطة نسبياً تصل سرعتها إلى "+Math.round(peakGust)+" كم/س");
 if(!parts.length)return"";
 return{message:parts.join(" · "),level:"info"};
}

/* تنبيه الغبار: لا يظهر إلا إذا أكدته الرياح الفعلية من MET واستمر ساعتين
   متتاليتين وكان قريباً زمنياً. الغبار البسيط يُتجاهل تماماً. */
function buildDust(data,now,ts){
 const h=data?.hourly;
 if(!h||!Array.isArray(h.time)||!Array.isArray(h.dust))throw Error("CAMS dust data missing");

 // بدون بيانات رياح موثوقة لا نُصدر تنبيه غبار (تجنباً للإنذار الكاذب)
 if(!Array.isArray(ts)||!ts.length)return null;

 const gustAt=t=>{
  let best=null,bd=Infinity;
  for(const e of ts){
   const dt=Math.abs(Date.parse(e.time)-t);
   if(dt<bd){bd=dt;best=e;}
  }
  if(!best||bd>90*60e3)return NaN;
  const g=num(best.data.instant.details.wind_speed_of_gust);
  return Number.isFinite(g)?g*3.6:NaN;
 };

 const rows=h.time.map((time,i)=>({time:Date.parse(time),dust:num(h.dust[i])}))
  .filter(x=>Number.isFinite(x.time)&&Number.isFinite(x.dust)&&
   x.time>=now-60*60e3&&x.time<=now+12*3600e3);
 if(!rows.length)return null;

 rows.forEach(r=>{
  r.gust=gustAt(r.time);
  r.strong=r.dust>=DUST_STRONG&&r.gust>=GUST_STRONG;
  r.severe=r.dust>=DUST_SEVERE&&r.gust>=GUST_SEVERE;
 });

 // أول فترة متتالية بطول الحد الأدنى
 let run=null;
 for(let i=0;i<rows.length;i++){
  if(!rows[i].strong)continue;
  let j=i;
  while(j+1<rows.length&&rows[j+1].strong)j++;
  if(j-i+1>=DUST_MIN_HOURS){run=rows.slice(i,j+1);break;}
  i=j;
 }
 if(!run||run[0].time>now+DUST_LEAD_H*3600e3)return null;

 const peak=run.reduce((a,b)=>b.dust>a.dust?b:a,run[0]);
 const severe=run.some(r=>r.severe);
 const when=run[0].time<=now?"الآن":"ابتداءً من "+timeLabel(run[0].time);

 return{
  state:severe?"تنبيه عاصفة غبارية قوية":"احتمال غبار كثيف",
  level:severe?"severe":"warning",
  detail:(severe?"يتوقع النموذج عاصفة غبارية مصحوبة برياح قوية ":"يتوقع النموذج ارتفاع الغبار مع نشاط الرياح ")+
   when+"، وقد يصل الغبار السطحي إلى "+Math.round(peak.dust)+" ميكروغرام/م³ تقريباً.",
  current:rows[0].dust,peak:peak.dust,peakTime:peak.time
 };
}
function renderDust(dust){
 const el=$("dustBox");
 if(!dust){el.hidden=true;return;}
 el.hidden=false;el.className="dustbox "+(dust.level||"");
 el.innerHTML=`<b>🌫️ ${dust.state}</b>${dust.detail}<small>أعلى قيمة غبار متوقعة: ${Math.round(dust.peak)} ميكروغرام/م³ · الوقت: ${timeLabel(dust.peakTime)} · المصدر: CAMS Global عبر Open-Meteo</small>`;
}
function getJSON(url){
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);
 return fetch(url,{signal:ctl.signal}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json();}).finally(()=>clearTimeout(t));
}
function scheduleRetry(ms){clearTimeout(retryT);retryT=setTimeout(load,ms);}
async function load(){
 if(loading)return;loading=true;
 try{
  const [rm,rw,rd]=await Promise.allSettled([getJSON(URL_MET),getJSON(URL_WTTR),getJSON(URL_DUST)]);
  let dust=null;
  if(rd.status==="fulfilled"){
   try{
    dust=buildDust(rd.value,Date.now(),rm.status==="fulfilled"?rm.value?.properties?.timeseries:null);
   }catch(e){console.warn("CAMS dust:",e);}
  }
  if(rm.status!=="fulfilled")throw Error("تعذر جلب بيانات MET Norway");
  const ts=rm.value?.properties?.timeseries;if(!Array.isArray(ts)||ts.length<20)throw Error("بيانات الطقس غير مكتملة");
  const now=Date.now();let ci=0,best=Infinity;
  ts.forEach((e,i)=>{const dt=Math.abs(Date.parse(e.time)-now);if(dt<best){best=dt;ci=i;}});
  const cur=ts[ci],d=cur.data.instant.details;
  let wc=null;if(rw.status==="fulfilled")wc=rw.value?.current_condition?.[0]||null;
  const metT=num(d.air_temperature),metH=num(d.relative_humidity);
  if(!Number.isFinite(metT))throw Error("بيانات الحرارة غير متوفرة");
  const t=metT,h=Number.isFinite(metH)?metH:(wc&&Number.isFinite(num(wc.humidity))?num(wc.humidity):50);
  const ws=num(d.wind_speed)||0,eff=effOf(d),sym=symOf(cur),kind=kindOf(sym),pr=precipPeriod(cur).mm;
  const e=(h/100)*6.105*Math.exp(17.27*t/(237.7+t)),feels=t+.33*e-.7*ws-4;
  const uvClear=num(d.ultraviolet_index_clear_sky);
  let uv=Number.isFinite(uvClear)?uvClear*(1-.75*Math.pow(eff/100,3.4)):(wc?num(wc.uvIndex):0);
  const st=sunTimes(now);if(now<st.sr||now>st.ss)uv=0;
  S={
   t:Math.round(t),f:Math.round(feels),w:Math.round(ws*3.6),h:Math.round(h),
   p:Math.round(num(d.air_pressure_at_sea_level)||0),uv:Math.max(0,Number.isFinite(uv)?uv:0),
   eff,precip:pr,kind,daily:buildDaily(ts,now),alert:buildAlert(ts,ci,now),
   src:"MET Norway"+(wc?" (wttr.in متاح كاحتياط)":""),dust,
   off:0,stale:false
  };
  clearTimeout(retryT);
 }catch(err){
  console.error("Weather:",err);
  if(S&&!S.off){S.stale=true;scheduleRetry(60000);}
  else{S={off:1,t:0,f:0,w:0,h:0,p:0,uv:0,eff:0,precip:0,kind:"none",daily:[],alert:"",src:"",stale:false};scheduleRetry(30000);}
 }finally{loading=false;render();}
}
function liveFx(){return currentWx()[2];}
function render(){
 $("cityName").textContent=CITY;$("date").textContent=dateFmt.format(new Date());
 const al=$("alert");
 if(S.off){
  $("temp").textContent="--°C";$("feels").textContent="";
  $("wi").textContent=$("hu").textContent=$("pr").textContent=$("uv").textContent="--";
  $("fcList").textContent="لا توجد توقعات متاحة حالياً.";
  $("liveTxt").textContent="تعذر الاتصال بخدمة الطقس، ستتم إعادة المحاولة";
  $("liveDot").style.background="#999";$("desc").textContent="الطقس غير متاحة الآن";$("hero").textContent="🌙";$("src").textContent="";al.hidden=true;renderDust(null);
 }else{
  $("temp").textContent=S.t+"°C";$("feels").textContent="الحرارة المحسوسة: "+S.f+"°C";
  $("wi").textContent=S.w+" كم/س";$("hu").textContent=S.h+"%";$("pr").textContent=S.p+" hPa";
  $("uv").textContent=Math.round(S.uv)+" ("+uvTxt(S.uv)+")";
  $("fcList").innerHTML=S.daily.map(x=>{const w=x.info;return `<div class="row r-${w[2]}"><div class="ic">${w[0]}</div><div class="d"><b>${DAYS[x.dn]}</b><span>${w[1]}</span></div><div class="tp"><span class="hi">${x.hi}°</span> / <span class="lo">${x.lo}°</span></div></div>`;}).join("")||'<div class="note">لا تتوفر حالياً توقعات يومية كافية.</div>';
  $("liveTxt").textContent=S.stale?"تعذر التحديث · آخر بيانات متاحة":"آخر تحديث لبيانات التوقعات";
  $("liveDot").style.background=S.stale?"#f5b02e":"#22e05a";$("liveDot").style.boxShadow=S.stale?"none":"0 0 10px #22e05a";
  $("src").textContent="📡 المصدر: "+S.src+" · توقعات نموذج جوي لمركز القضاء";
  al.textContent=S.alert?.message||"";al.className="alert info";al.hidden=!S.alert;
  renderDust(S.dust);
 }
 setFx(liveFx());if(reduce)draw(performance.now());
}
function sky(){
 const now=Date.now(),t0=sunTimes(now);
 if(now>=t0.sr&&now<=t0.ss){const f=(now-t0.sr)/(t0.ss-t0.sr);return{a:Math.sin(Math.PI*f),day:true,pos:f};}
 let from,to;if(now>t0.ss){from=t0.ss;to=sunTimes(now+864e5).sr;}else{from=sunTimes(now-864e5).ss;to=t0.sr;}
 const pos=cl01((now-from)/(to-from));return{a:-Math.sin(Math.PI*pos),day:false,pos};
}
const cv=$("fx"),cx=cv.getContext("2d");
let W=1,H=1,P=[],CL=[],ST=[],flash=0;
const KS=[[-1,[5,10,26],[12,22,52]],[-.25,[10,18,45],[30,40,85]],[0,[60,60,120],[240,130,80]],[.15,[60,110,180],[250,190,120]],[.5,[30,100,180],[130,195,240]],[1,[20,100,190],[150,215,255]]];
function pal(a){a=Math.max(-1,Math.min(1,a));let i=0;while(i<KS.length-2&&a>KS[i+1][0])i++;const k=KS[i],n=KS[i+1],t=(a-k[0])/(n[0]-k[0]);return[mix(k[1],n[1],t),mix(k[2],n[2],t)];}
function cover(){if(mode==="rain")return Math.max(.9,S.eff/100);if(isClear())return 0;return Math.min(1,S.eff/100);}
function size(){W=cv.width=Math.max(1,innerWidth);H=cv.height=Math.max(1,innerHeight);}
function initScene(){
 size();P=[];const count=mode==="rain"?180:0;
 for(let i=0;i<count;i++)P.push({x:Math.random()*W,y:Math.random()*H,s:Math.random(),r:Math.random()});
 ST=[];for(let i=0;i<100;i++)ST.push({x:Math.random()*W,y:Math.random()*H*.7,s:Math.random(),r:Math.random()*20});
 CL=[];for(let i=0;i<Math.round(cover()*10);i++){const sc=.6+Math.random()*1.1,pf=[];for(let j=0;j<9;j++){const u=j/8-.5;pf.push({dx:u*190*sc+(Math.random()-.5)*26,dy:(Math.random()-.5)*16*sc-(1-Math.abs(u)*2)*20*sc,r:(32+Math.random()*28)*sc*(1-Math.abs(u)*.5)});}CL.push({x:Math.random()*(W+500)-250,y:H*(.05+Math.random()*.5),v:.12+Math.random()*.3,pf});}
}
function setFx(fx){
 mode=fx;const night=sky().a<0;
 if(!S.off){const w=currentWx();let icon=w[0],desc=w[1];if(fx==="sunny"){icon=night?"🌙":"☀️";desc=night?"سماء صافية ليلاً":w[1];}
  $("desc").textContent=desc;
  if(fx==="sunny"&&!night){if(!$("hero").querySelector(".sun"))$("hero").innerHTML='<div class="sun"></div>';}else $("hero").textContent=icon;
 }else $("hero").textContent=night?"🌙":"☀️";
 const key=fx+Math.round(cover()*5);if(key!==curKey||(!CL.length&&cover()>0)){curKey=key;initScene();}
}
function draw(t){
 if(!S)return;const {a,day,pos}=sky(),cov=cover();let[top,bot]=pal(a);
 const gray=mode==="rain"?.7:(mode==="cloudy"||mode==="snow")?.45:0,lum=(top[0]+top[1]+top[2])/3;
 if(gray){top=mix(top,[lum*.8,lum*.85,lum*.95],gray);bot=mix(bot,[lum*1.15,lum*1.2,lum*1.25],gray);}
 const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 const sa=cl01(-a*3)*(1-cov*.75);
 if(sa>0)ST.forEach(s=>{cx.fillStyle=`rgba(255,255,255,${sa*(.3+.7*Math.abs(Math.sin(t/900+s.r)))})`;cx.beginPath();cx.arc(s.x,s.y,.5+s.s*1.2,0,Math.PI*2);cx.fill();});
 const hy=H*.7,px=W*(.12+.76*pos),py=hy-Math.sin(Math.PI*pos)*H*.48,vis=1-cov*.6;
 if(day){const warm=cl01(1-a*3),c=mix([255,245,205],[255,140,60],warm);let g=cx.createRadialGradient(px,py,0,px,py,H*.55);g.addColorStop(0,rgb(c,.55*vis));g.addColorStop(.25,rgb(c,.2*vis));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.fillRect(0,0,W,H);g=cx.createRadialGradient(px,py,0,px,py,38);g.addColorStop(0,rgb([255,255,240],vis));g.addColorStop(.7,rgb(c,vis));g.addColorStop(1,rgb(c,0));cx.fillStyle=g;cx.beginPath();cx.arc(px,py,38,0,Math.PI*2);cx.fill();}
 else{const g=cx.createRadialGradient(px,py,0,px,py,H*.3);g.addColorStop(0,`rgba(190,205,255,${.3*vis})`);g.addColorStop(1,"rgba(190,205,255,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.globalAlpha=vis;cx.fillStyle="#f1f1e6";cx.beginPath();cx.arc(px,py,26,0,Math.PI*2);cx.fill();cx.globalAlpha=1;}
 let cc=mix([70,80,120],[255,255,255],cl01((a+.3)/.8)),tw=cl01(1-Math.abs(a-.05)/.25);cc=mix(cc,[255,185,150],tw*.6);if(gray)cc=mix(cc,[110,120,138],gray);
 CL.forEach(c=>{if(!reduce){c.x+=c.v;if(c.x>W+260)c.x=-260;}c.pf.forEach(q=>{const x=c.x+q.dx,y=c.y+q.dy,g=cx.createRadialGradient(x,y,0,x,y,q.r);g.addColorStop(0,rgb(cc,.5+.35*cov));g.addColorStop(.55,rgb(cc,.3+.2*cov));g.addColorStop(1,rgb(cc,0));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,q.r,0,Math.PI*2);cx.fill();});});
 if(mode==="rain"){cx.strokeStyle="#bedcff80";cx.lineWidth=1.2;cx.beginPath();P.forEach(p=>{cx.moveTo(p.x,p.y);cx.lineTo(p.x-3,p.y+14+p.s*10);if(!reduce){p.y+=9+p.s*9;p.x-=1.2;if(p.y>H){p.y=-20;p.x=Math.random()*W;}}});cx.stroke();
  if(!reduce&&thunderSoon&&Math.random()<.002)flash=1;
  if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash*.35})`;cx.fillRect(0,0,W,H);flash-=.06;}
 }
}
function loop(t){if(S)draw(t);raf=requestAnimationFrame(loop);}
function startLoop(){if(!raf&&!reduce&&onScreen&&!document.hidden)raf=requestAnimationFrame(loop);}
function stopLoop(){cancelAnimationFrame(raf);raf=0;}
if("IntersectionObserver"in window)new IntersectionObserver(es=>{onScreen=es[0].isIntersecting;onScreen?startLoop():stopLoop();}).observe(document.querySelector(".wrap"));
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopLoop();else{startLoop();load();}});
let rsT=0,lastW=innerWidth;
window.addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(innerWidth!==lastW){lastW=innerWidth;if(S)initScene();else size();}else size();if(S&&reduce)draw(performance.now());},150);});
let lastH=0;
function postHeight(){if(parent===window)return;const w=document.querySelector(".wrap"),cs=getComputedStyle(document.body),h=Math.ceil(w.getBoundingClientRect().height+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom));if(Math.abs(h-lastH)>2){lastH=h;parent.postMessage({wxHeight:h},"*");}}
if("ResizeObserver"in window)new ResizeObserver(postHeight).observe(document.querySelector(".wrap"));
window.addEventListener("load",postHeight);
$("ref").addEventListener("click",()=>{const r=$("ref");r.classList.add("spin");setTimeout(()=>r.classList.remove("spin"),600);load();});
if("serviceWorker"in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(err=>console.error("SW:",err));});
setInterval(load,10*60*1000);
size();load();startLoop();
</script>
