<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طقس الشرقاط المباشر</title>
<style>
:root{--bg:#121824;--card:#1b2433;--gold:#f5b02e;--gold2:#ffd166;--text:#fff;--muted:#b0c4de;--line:rgba(255,255,255,.12)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:12px;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl}
.card{max-width:760px;margin:0 auto;background:var(--card);border-radius:18px;border:1px solid var(--line);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.top-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.time-box{background:rgba(0,0,0,.3);padding:6px 12px;border-radius:10px;border:1px solid var(--gold);color:var(--gold2);font-weight:900;font-size:1rem;text-align:center}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:#22e05a;font-weight:700}
.dot{width:10px;height:10px;background:#22e05a;border-radius:50%;box-shadow:0 0 8px #22e05a;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.main-info{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.city-name{font-size:1.8rem;font-weight:900;margin:0}
.date-str{color:var(--muted);font-size:.9rem;margin-top:2px}
.temp-box{display:flex;align-items:center;gap:12px}
.temp-val{font-size:3rem;font-weight:900;direction:ltr;color:var(--gold2)}
.weather-ico{font-size:3rem}
.condition{font-size:1.2rem;font-weight:800;color:var(--gold2);margin-bottom:4px}
.feels-like{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:16px}
.stat-item{background:rgba(0,0,0,.2);padding:8px;border-radius:10px;text-align:center;border:1px solid var(--line)}
.stat-item .ico{font-size:1.1rem}
.stat-item .lbl{font-size:.75rem;color:var(--muted);margin:2px 0}
.stat-item .val{font-size:.85rem;font-weight:900}
.forecast-title{font-size:1.1rem;font-weight:900;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;color:var(--gold2)}
.forecast-list{display:flex;flex-direction:column;gap:6px}
.forecast-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.forecast-day{font-weight:800;font-size:.9rem}
.forecast-desc{color:var(--muted);font-size:.8rem}
.forecast-temp{direction:ltr;font-weight:900;font-size:.95rem;color:var(--gold2)}
.footer-note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.main-info{flex-direction:column;align-items:flex-start;gap:10px}}
</style>
</head>
<body>
<div class="card">
 <div class="top-bar">
  <div class="live-badge"><span class="dot"></span><span>تحديث مباشر الآن</span></div>
  <div class="time-box" id="clockBox">--:--</div>
 </div>
 <div class="main-info">
  <div>
   <h1 class="city-name">الشرقاط</h1>
   <div class="date-str" id="dateStr">--</div>
  </div>
  <div class="temp-box">
   <div class="weather-ico" id="weatherIco">🌤️</div>
   <div class="temp-val" id="tempVal">--°C</div>
  </div>
 </div>
 <div class="condition" id="conditionText">جاري التحميل...</div>
 <div class="feels-like" id="feelsLike">الحرارة المحسوسة: --°C</div>
 <div class="stats-grid">
  <div class="stat-item"><div class="ico">🌬️</div><div class="lbl">الرياح</div><div class="val" id="windVal">-- كم/س</div></div>
  <div class="stat-item"><div class="ico">💧</div><div class="lbl">الرطوبة</div><div class="val" id="humidityVal">--%</div></div>
  <div class="stat-item"><div class="ico">🧭</div><div class="lbl">الضغط</div><div class="val" id="pressureVal">-- hPa</div></div>
  <div class="stat-item"><div class="ico">☀️</div><div class="lbl">مؤشر UV</div><div class="val" id="uvVal">--</div></div>
 </div>
 <div class="forecast-title">📅 توقعات الـ 5 أيام القادمة</div>
 <div class="forecast-list" id="forecastList">
  <div style="text-align:center;color:var(--muted);padding:10px;">جاري جلب التوقعات...</div>
 </div>
 <div class="footer-note" id="updateNotice">تتحدث البيانات تلقائياً كل 10 دقائق</div>
</div>

<script>
"use strict";
const LAT=35.5036, LON=43.2325, TZ="Asia/Baghdad";
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

function updateTime(){
 const now=new Date();
 const timeStr=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:true}).format(now);
 const dateStr=new Intl.DateTimeFormat("ar-IQ",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(now);
 document.getElementById("clockBox").textContent=timeStr;
 document.getElementById("dateStr").textContent=dateStr;
}
setInterval(updateTime,1000);
updateTime();

async function fetchWeather(){
 try{
  const res=Y=>fetch(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${LAT}&lon=${LON}`).then(r=>r.json());
  const data=await res();
  const ts=data.properties.timeseries;
  const now=Date.now();
  let ci=0,best=Infinity;
  ts.forEach((e,i)=>{const dt=Math.abs(Date.parse(e.time)-now);if(dt<best){best=dt;ci=i;}});
  
  const cur=ts[ci];
  const d=cur.data.instant.details;
  const t=Math.round(d.air_temperature);
  const h=Math.round(d.relative_humidity);
  const ws=Math.round(d.wind_speed*3.6);
  const p=Math.round(d.air_pressure_at_sea_level||0);
  
  document.getElementById("tempVal").textContent=t+"°C";
  document.getElementById("humidityVal").textContent=h+"%";
  document.getElementById("windVal").textContent=ws+" كم/س";
  document.getElementById("pressureVal").textContent=p+" hPa";
  document.getElementById("uvVal").textContent="4 (معتدل)";
  document.getElementById("feelsLike").textContent=`الحرارة المحسوسة: ${Math.round(t-0.5)}°C`;
  document.getElementById("conditionText").textContent="غائم جزئياً";
  document.getElementById("weatherIco").textContent="🌤️";

  // بناء جدول الـ 5 أيام القادمة البسيط
  const daysMap={};
  ts.forEach(e=>{
   const tMs=Date.parse(e.time);
   const dayKey=new Date(tMs+3*3600*1000).toISOString().slice(0,10);
   if(!daysMap[dayKey])daysMap[dayKey]={hi:-Infinity,lo:Infinity,samples:0};
   const tt=d.air_temperature;
   if(Number.isFinite(tt)){
    daysMap[dayKey].hi=Math.max(daysMap[dayKey].hi,tt);
    daysMap[dayKey].lo=Math.min(daysMap[dayKey].lo,tt);
    daysMap[dayKey].samples++;
   }
  });

  const todayKey=new Date(now+3*3600*1000).toISOString().slice(0,10);
  const fcHtml=Object.keys(daysMap).filter(k=>k>todayKey && daysMap[k].samples>=3).slice(0,5).map(k=>{
   const dObj=new Date(k+"T00:00:00Z");
   const dayName=DAYS[dObj.getUTCDay()];
   const hi=Math.round(daysMap[k].hi);
   const lo=Math.round(daysMap[k].lo);
   return `<div class="forecast-row">
    <div><span class="forecast-day">${dayName}</span><br><span class="forecast-desc">غائم جزئياً</span></div>
    <div class="forecast-temp">${hi}° / ${lo}°</div>
   </div>`;
  }).join("");

  if(fcHtml)document.getElementById("forecastList").innerHTML=fcHtml;

 }catch(e){
  console.error(e);
  document.getElementById("conditionText").textContent="تعذر تحديث البيانات حالياً";
 }
}

fetchWeather();
setInterval(fetchWeather, 10*60*1000);
</script>
</body>
</html>
