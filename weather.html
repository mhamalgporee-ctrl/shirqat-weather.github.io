<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2137">
<title>طقس الشرقاط المباشر</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#121824;--card:#1b2433;--gold:#f5b02e;--gold2:#ffd166;--text:#fff;--muted:#b0c4de;--line:rgba(255,255,255,.12)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:12px;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl}
.card{max-width:760px;margin:0 auto;background:var(--card);border-radius:18px;border:1px solid var(--line);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.top-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.time-box{background:rgba(0,0,0,.3);padding:6px 12px;border-radius:10px;border:1px solid var(--gold);color:var(--gold2);font-weight:900;font-size:1rem;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:#22e05a;font-weight:700}
.dot{width:10px;height:10px;background:#22e05a;border-radius:50%;box-shadow:0 0 8px #22e05a;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.main-info{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.city-name{font-size:1.8rem;font-weight:900;margin:0}
.date-str{color:var(--muted);font-size:.9rem;margin-top:2px}
.temp-box{display:flex;align-items:center;gap:12px}
.temp-val{font-size:3rem;font-weight:900;direction:ltr;color:var(--gold2)}
.weather-ico{font-size:3rem}
.condition{font-size:1.2rem;font-weight:800;color:var(--gold2);margin-bottom:4px}
.feels-like{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.alert{margin:0 0 12px;padding:8px 10px;border-inline-start:4px solid #ff6b5e;background:#96140fbb;border-radius:8px;font-weight:700;font-size:.9rem;line-height:1.5}
[hidden]{display:none!important}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:16px}
.stat-item{background:rgba(0,0,0,.2);padding:8px;border-radius:10px;text-align:center;border:1px solid var(--line)}
.stat-item .ico{font-size:1.1rem}
.stat-item .lbl{font-size:.75rem;color:var(--muted);margin:2px 0}
.stat-item .val{font-size:.85rem;font-weight:900;overflow-wrap:anywhere}
.forecast-title{font-size:1.1rem;font-weight:900;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;color:var(--gold2)}
.forecast-list{display:flex;flex-direction:column;gap:6px}
.forecast-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.04);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.forecast-ico{font-size:1.4rem;width:32px;text-align:center}
.forecast-info{flex:1;min-width:0}
.forecast-day{font-weight:800;font-size:.9rem;display:block}
.forecast-desc{color:var(--muted);font-size:.8rem}
.forecast-temp{direction:ltr;font-weight:900;font-size:.95rem;color:var(--gold2);white-space:nowrap}
.footer-note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:8px;line-height:1.7}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.main-info{flex-direction:column;align-items:flex-start;gap:10px}}
</style>
</head>
<body>
<div class="card">
 <div class="top-bar">
  <div class="live-badge"><span class="dot" id="liveDot"></span><span id="liveTxt">جارٍ التحميل…</span></div>
  <div class="time-box" id="clockBox">--:--</div>
 </div>
 <div class="main-info">
  <div>
   <h1 class="city-name">الشرقاط</h1>
   <div class="date-str" id="dateStr">--</div>
  </div>
  <div class="temp-box">
   <div class="weather-ico" id="weatherIco">🌤️</div>
   <div class="temp-val" id="tempVal">--°C</div>
  </div>
 </div>
 <div class="condition" id="conditionText">جارٍ التحميل...</div>
 <div class="feels-like" id="feelsLike">الحرارة المحسوسة: --°C</div>
 <div class="alert" id="alertBox" role="alert" hidden></div>
 <div class="stats-grid">
  <div class="stat-item"><div class="ico">🌬️</div><div class="lbl">الرياح</div><div class="val" id="windVal">-- كم/س</div></div>
  <div class="stat-item"><div class="ico">💧</div><div class="lbl">الرطوبة</div><div class="val" id="humidityVal">--%</div></div>
  <div class="stat-item"><div class="ico">🧭</div><div class="lbl">الضغط</div><div class="val" id="pressureVal">-- hPa</div></div>
  <div class="stat-item"><div class="ico">☀️</div><div class="lbl">مؤشر UV</div><div class="val" id="uvVal">--</div></div>
 </div>
 <div class="forecast-title">📅 توقعات الـ 5 أيام القادمة</div>
 <div class="forecast-list" id="forecastList">
  <div style="text-align:center;color:var(--muted);padding:10px;">جارٍ جلب التوقعات...</div>
 </div>
 <div class="footer-note">تتحدث البيانات تلقائياً كل 10 دقائق<br><span id="srcNote">المصدر: MET Norway</span></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LAT=35.5036,LON=43.2325,TZ="Asia/Baghdad";
const OFF=3*3600; /* العراق UTC+3 طوال العام */
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const URL_MET=`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${LAT}&lon=${LON}`;

const num=v=>(v===null||v===undefined||v==="")?NaN:Number(v);
const finite=Number.isFinite;

/* ---------- الساعة والتاريخ ---------- */
const clockFmt=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const dateFmt=new Intl.DateTimeFormat("ar-IQ",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});

function updateTime(){
 const now=new Date();
 const p={};
 clockFmt.formatToParts(now).forEach(x=>p[x.type]=x.value);
 const h=Number(p.hour)%24;
 $("clockBox").textContent=String(h%12||12).padStart(2,"0")+":"+p.minute+" "+(h<12?"صباحاً":"مساءً");
 $("dateStr").textContent=dateFmt.format(now);
}
setInterval(updateTime,1000);
updateTime();

/* ---------- تصنيف الحالة الجوية ---------- */
const symOf=e=>e.data.next_1_hours?.summary?.symbol_code??e.data.next_6_hours?.summary?.symbol_code??e.data.next_12_hours?.summary?.symbol_code??"";
const precipOf=e=>num(e.data.next_1_hours?.details?.precipitation_amount??e.data.next_6_hours?.details?.precipitation_amount)||0;

function kindOf(sym){
 sym=String(sym||"");
 if(/thunder/.test(sym))return"thunder";
 if(/snow/.test(sym))return"snow";
 if(/rain|sleet|drizzle/.test(sym))return"rain";
 if(/fog/.test(sym))return"fog";
 return"none";
}

/* الغيوم المنخفضة والمتوسطة تحجب الشمس، والعالية الرقيقة تُحتسب بربعها */
function effOf(d){
 const lo=num(d.cloud_area_fraction_low),mi=num(d.cloud_area_fraction_medium),hi=num(d.cloud_area_fraction_high);
 if([lo,mi,hi].every(finite))return Math.min(100,Math.max(lo,mi)+.25*hi);
 const t=num(d.cloud_area_fraction);
 return finite(t)?t:0;
}

function cloudWx(e,night){
 if(e<=20)return night?["🌙","سماء صافية ليلاً"]:["☀️","صحو"];
 if(e<=40)return["🌤️","صحو مع غيوم خفيفة"];
 if(e<=65)return["⛅","غائم جزئياً"];
 if(e<=85)return["🌥️","غائم غالباً"];
 return["☁️","غائم"];
}

const uvTxt=u=>u<3?"منخفض":u<6?"معتدل":u<8?"مرتفع":u<11?"مرتفع جداً":"شديد";

/* ---------- التوقعات اليومية ---------- */
const dayKey=ms=>new Date(ms+OFF*1000).toISOString().slice(0,10);

function buildDaily(ts,now){
 const days={};
 for(const e of ts){
  const t=Date.parse(e.time);
  if(!finite(t))continue;
  const key=dayKey(t);
  const o=days[key]||(days[key]={n:0,hi:-Infinity,lo:Infinity,pr:0,wind:0,cl:[],thunder:false,snow:false});
  const d=e.data.instant.details;
  o.n++;
  const tt=num(d.air_temperature);
  if(finite(tt)){o.hi=Math.max(o.hi,tt);o.lo=Math.min(o.lo,tt);}
  const ws=num(d.wind_speed)*3.6;
  if(finite(ws))o.wind=Math.max(o.wind,ws);
  const hr=new Date(t+OFF*1000).getUTCHours();
  if(hr>=7&&hr<=17)o.cl.push(effOf(d));
  o.pr+=precipOf(e);
  const k=kindOf(symOf(e));
  if(k==="thunder")o.thunder=true;
  if(k==="snow")o.snow=true;
 }
 const today=dayKey(now);
 return Object.keys(days).sort().filter(k=>k>today&&days[k].n>=3&&finite(days[k].hi)).slice(0,5).map(k=>{
  const o=days[k];
  let info;
  if(o.thunder)info=["⛈️","عواصف رعدية"];
  else if(o.snow)info=["❄️","ثلوج"];
  else if(o.pr>=3)info=["🌧️","أمطار"];
  else if(o.pr>=.5)info=["🌦️","زخات مطر"];
  else if(o.wind>=45)info=["🌬️","نشاط رياح"];
  else info=cloudWx(o.cl.length?o.cl.reduce((a,b)=>a+b,0)/o.cl.length:0,false);
  return{hi:Math.round(o.hi),lo:Math.round(o.lo),info,dn:new Date(k+"T00:00:00Z").getUTCDay()};
 });
}

/* ---------- تنبيه الـ 12 ساعة القادمة ---------- */
function buildAlert(ts,ci,now){
 let thunder=false,wet=false,gust=0;
 for(let i=ci;i<ts.length;i++){
  const e=ts[i],t=Date.parse(e.time);
  if(t>now+12*3600e3)break;
  const d=e.data.instant.details;
  const k=kindOf(symOf(e));
  if(k==="thunder")thunder=true;
  if(k==="rain"||precipOf(e)>.2)wet=true;
  const g=num(d.wind_speed_of_gust),w=num(d.wind_speed);
  const gk=(finite(g)?g:(finite(w)?w*1.4:0))*3.6;
  gust=Math.max(gust,gk);
 }
 const parts=[];
 if(thunder)parts.push("⚡ عواصف رعدية وبرق");
 if(wet)parts.push("🌧️ أمطار متوقعة");
 if(gust>=65)parts.push(`💨 رياح عاصفة، هبات حتى ${Math.round(gust)} كم/س`);
 else if(gust>=45)parts.push(`💨 رياح قوية، هبات حتى ${Math.round(gust)} كم/س`);
 return parts.length?"تنبيه جوي: "+parts.join(" · "):"";
}

/* ---------- جلب البيانات ---------- */
function getJSON(url){
 const ctl=new AbortController();
 const t=setTimeout(()=>ctl.abort(),15000);
 return fetch(url,{signal:ctl.signal})
  .then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json();})
  .finally(()=>clearTimeout(t));
}

let hasData=false,loading=false,retryT=0;

function setLive(ok){
 $("liveTxt").textContent=ok?"تحديث مباشر الآن":"تعذر التحديث · آخر بيانات محفوظة";
 $("liveDot").style.background=ok?"#22e05a":"#f5b02e";
 $("liveDot").style.boxShadow=ok?"0 0 8px #22e05a":"none";
}

async function fetchWeather(){
 if(loading)return;
 loading=true;
 try{
  const data=await getJSON(URL_MET);
  const ts=data?.properties?.timeseries;
  if(!Array.isArray(ts)||ts.length<20)throw Error("بيانات الطقس غير مكتملة");

  const now=Date.now();
  let ci=0,best=Infinity;
  ts.forEach((e,i)=>{const dt=Math.abs(Date.parse(e.time)-now);if(dt<best){best=dt;ci=i;}});
  const cur=ts[ci],d=cur.data.instant.details;

  const tRaw=num(d.air_temperature);
  if(!finite(tRaw))throw Error("بيانات الحرارة غير متوفرة");
  const t=Math.round(tRaw);
  const h=finite(num(d.relative_humidity))?Math.round(num(d.relative_humidity)):0;
  const wms=num(d.wind_speed)||0;
  const ws=Math.round(wms*3.6);
  const p=Math.round(num(d.air_pressure_at_sea_level)||0);

  /* الحرارة المحسوسة (معادلة Steadman) */
  const ev=(h/100)*6.105*Math.exp(17.27*tRaw/(237.7+tRaw));
  const feels=Math.round(tRaw+.33*ev-.7*wms-4);

  /* مؤشر UV: سماء صافية مخفَّض حسب الغيوم (ويساوي 0 ليلاً في بيانات المصدر) */
  const eff=effOf(d);
  const uvClear=num(d.ultraviolet_index_clear_sky);
  const uv=finite(uvClear)?Math.max(0,uvClear*(1-.75*Math.pow(eff/100,3.4))):0;

  /* الحالة الحالية */
  const kind=kindOf(symOf(cur));
  const precip=precipOf(cur);
  const hr=new Date(now+OFF*1000).getUTCHours();
  const night=hr<6||hr>=18;
  let w;
  if(kind==="thunder")w=["⛈️","عواصف رعدية"];
  else if(kind==="snow")w=["❄️","ثلوج"];
  else if(kind==="rain"||precip>=.2)w=["🌧️",precip>=1?"أمطار":"زخات مطر"];
  else if(kind==="fog")w=["🌫️","ضباب"];
  else w=cloudWx(eff,night);

  $("tempVal").textContent=t+"°C";
  $("humidityVal").textContent=h+"%";
  $("windVal").textContent=ws+" كم/س";
  $("pressureVal").textContent=p+" hPa";
  $("uvVal").textContent=Math.round(uv)+" ("+uvTxt(uv)+")";
  $("feelsLike").textContent="الحرارة المحسوسة: "+feels+"°C";
  $("weatherIco").textContent=w[0];
  $("conditionText").textContent=w[1];

  const al=buildAlert(ts,ci,now);
  $("alertBox").textContent=al;
  $("alertBox").hidden=!al;

  const daily=buildDaily(ts,now);
  if(daily.length){
   $("forecastList").innerHTML=daily.map(x=>
    `<div class="forecast-row"><div class="forecast-ico">${x.info[0]}</div><div class="forecast-info"><span class="forecast-day">${DAYS[x.dn]}</span><span class="forecast-desc">${x.info[1]}</span></div><div class="forecast-temp">${x.hi}° / ${x.lo}°</div></div>`
   ).join("");
  }

  hasData=true;
  setLive(true);
  clearTimeout(retryT);
 }catch(err){
  console.error("Weather:",err);
  if(hasData){
   setLive(false);
  }else{
   $("liveTxt").textContent="تعذر الاتصال بخدمة الطقس";
   $("liveDot").style.background="#999";
   $("liveDot").style.boxShadow="none";
   $("conditionText").textContent="الطقس غير متاح الآن";
   $("forecastList").textContent="لا توجد توقعات متاحة حالياً.";
  }
  clearTimeout(retryT);
  retryT=setTimeout(fetchWeather,hasData?60000:30000);
 }finally{
  loading=false;
 }
}

document.addEventListener("visibilitychange",()=>{if(!document.hidden)fetchWeather();});

/* تسجيل الـ Service Worker */
if("serviceWorker"in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(err=>console.error("SW:",err));
 });
}

fetchWeather();
setInterval(fetchWeather,10*60*1000);
</script>
</body>
</html>
